<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Churn Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            margin:0;
            background:linear-gradient(120deg,#7ee8fa,#80d0c7);
        }

        header{
            padding:15px 30px;
            background:#3aa6ff;
            color:#fff;
        }

        .nav span{
            margin-right:20px;
            cursor:pointer;
        }

        .container{
            max-width:900px;
            margin:40px auto;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 20px 40px rgba(0,0,0,.15);
        }

        h1{
            text-align:center;
            color:#2c3e50;
        }

        .subtitle{
            text-align:center;
            margin-bottom:30px;
            color:#666;
        }

        .card{
            margin-bottom:30px;
        }

        .card h3{
            margin-bottom:15px;
            color:#34495e;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:15px;
        }

        .field label{
            font-size:14px;
            font-weight:500;
            color:#555;
            margin-bottom:6px;
            display:block;
        }

        input,select{
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
            width:100%;
        }

        .sim-grid{
            display:flex;
            justify-content:space-around;
            flex-wrap:wrap;
            gap:15px;
        }

        .sim-grid label{
            background:#f4f6f8;
            padding:10px 18px;
            border-radius:10px;
            cursor:pointer;
        }

        .predict-btn{
            width:100%;
            padding:14px;
            background:linear-gradient(90deg,#4facfe,#00f2fe);
            color:#fff;
            font-size:16px;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        .predict-btn:hover{
            opacity:0.9;
        }

        .result{
            margin-top:25px;
            text-align:center;
            font-size:18px;
            font-weight:600;
            color:#27ae60;
        }
    </style>
</head>

<body>

<header>
    <div class="nav">
        <span>📊 About Project</span>
        <span>📥 About Inputs</span>
        <span>👨‍💻 About Author</span>
    </div>
</header>

<div class="container">
    <h1>Customer Churn Prediction</h1>
    <p class="subtitle">Enter customer details to predict the likelihood</p>

    <form action="/predict" method="POST">

        <!-- Customer Details -->
        <div class="card">
            <h3>👤 Customer Details</h3>
            <div class="grid">

                <div class="field">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div class="field">
                    <label>Senior Citizen</label>
                    <select name="SeniorCitizen">
                        <option value="">Select</option>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="field">
                    <label>Partner</label>
                    <select name="Partner">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="field">
                    <label>Dependents</label>
                    <select name="Dependents">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="field">
                    <label>Tenure (Months)</label>
                    <input type="number" name="tenure" required>
                </div>

            </div>
        </div>

        <!-- Service Details -->
        <div class="card">
            <h3>📡 Service Details</h3>
            <div class="grid">

                <div class="field">
                    <label>Phone Service</label>
                    <select name="PhoneService"><option>Yes</option><option>No</option></select>
                </div>

                <div class="field">
                    <label>Multiple Lines</label>
                    <select name="MultipleLines">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No phone service</option>
                    </select>
                </div>

                <div class="field">
                    <label>Internet Service</label>
                    <select name="InternetService">
                        <option>DSL</option>
                        <option>Fiber optic</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="field">
                    <label>Online Security</label>
                    <select name="OnlineSecurity"><option>Yes</option><option>No</option></select>
                </div>

                <div class="field">
                    <label>Online Backup</label>
                    <select name="OnlineBackup"><option>Yes</option><option>No</option></select>
                </div>

                <div class="field">
                    <label>Device Protection</label>
                    <select name="DeviceProtection"><option>Yes</option><option>No</option></select>
                </div>

                <div class="field">
                    <label>Tech Support</label>
                    <select name="TechSupport"><option>Yes</option><option>No</option></select>
                </div>

                <div class="field">
                    <label>Streaming TV</label>
                    <select name="StreamingTV"><option>Yes</option><option>No</option></select>
                </div>

                <div class="field">
                    <label>Streaming Movies</label>
                    <select name="StreamingMovies"><option>Yes</option><option>No</option></select>
                </div>

            </div>
        </div>

        <!-- SIM Provider -->
        <div class="card">
            <h3>📱 SIM Provider</h3>
            <div class="sim-grid">
                <label><input type="radio" name="SIM_Provider" value="Airtel" required> Airtel</label>
                <label><input type="radio" name="SIM_Provider" value="Jio"> Jio</label>
                <label><input type="radio" name="SIM_Provider" value="VI"> VI</label>
                <label><input type="radio" name="SIM_Provider" value="BSNL"> BSNL</label>
            </div>
        </div>

        <!-- Billing Details -->
        <div class="card">
            <h3>💳 Billing Details</h3>
            <div class="grid">

                <div class="field">
                    <label>Paperless Billing</label>
                    <select name="PaperlessBilling"><option>Yes</option><option>No</option></select>
                </div>

                <div class="field">
                    <label>Payment Method</label>
                    <select name="PaymentMethod">
                        <option>Electronic check</option>
                        <option>Mailed check</option>
                        <option>Bank transfer (automatic)</option>
                        <option>Credit card (automatic)</option>
                    </select>
                </div>

                <div class="field">
                    <label>Monthly Charges</label>
                    <input type="number" step="0.01" name="MonthlyCharges" required>
                </div>

                <div class="field">
                    <label>Total Charges</label>
                    <input type="number" step="0.01" name="TotalCharges" required>
                </div>

            </div>
        </div>

        <button type="submit" class="predict-btn">🔍 Predict Customer Likelihood</button>
    </form>

    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}
</div>

</body>
</html>
